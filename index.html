<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE RECUPERACIÓN DE MEMORIA</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace; 
            background-color: #000000; 
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .terminal {
            text-align: center;
            border: 1px solid #333;
            padding: 50px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            width: 400px;
        }

        h1 {
            font-size: 1.2em;
            letter-spacing: 4px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 1px solid #ffffff;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2em;
            text-align: center;
            outline: none;
            width: 100%;
            margin-bottom: 20px;
            padding: 10px 0;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 30px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        button:hover {
            background: #cccccc;
        }

        #error-msg {
            margin-top: 20px;
            font-size: 0.8em;
            color: #555;
            display: none;
            text-transform: uppercase;
        }

        /* Efecto de parpadeo para el error */
        .flicker {
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <h1>Cual es su nombre...</h1>
        <input type="text" id="passInput" placeholder="..." autofocus>
        <br>
        <button onclick="checkPass()">EnTR</button>
        <p id="error-msg">Error: Sujeto no identificado.</p>
    </div>

    <script>
        function checkPass() {
            const input = document.getElementById("passInput").value.trim().toLowerCase();
            const error = document.getElementById("error-msg");
            
            // La contraseña es "gabriel" (en minúsculas aquí para comparar)
            if (input === "gabriel") {
                window.location.href = "https://youtu.be/_6VHQoDtVNs";
            } else {
                error.style.display = "block";
                error.classList.add("flicker");
                document.getElementById("passInput").value = "";
                
                // Quitar el parpadeo después de un segundo
                setTimeout(() => {
                    error.classList.remove("flicker");
                }, 1000);
            }
        }

        // Permitir usar la tecla Enter
        document.getElementById("passInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkPass();
            }
        });
    </script>
</body>
</html>
